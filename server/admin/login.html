<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin Login — Adane International Hotel</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="login-brand">Adane<span>International Hotel</span></div>
    <h1>Admin Login</h1>
    <p class="login-sub">Sign in to manage the menu.</p>
    <form id="loginForm" novalidate>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <p id="loginError" class="form-error" hidden></p>
      <button type="submit" class="btn-primary" id="loginBtn">Log in</button>
    </form>
  </main>
  <script src="js/admin.js"></script>
  <script>AdaneAdmin.initLogin();</script>
</body>
</html>
